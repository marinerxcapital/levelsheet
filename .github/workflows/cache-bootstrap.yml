name: Nightly cache bootstrap
on:
  schedule:
    - cron: "0 6 * * 1-5"  # 06:00 UTC weekdays
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Warm cache
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python scripts/bootstrap_cache.py
      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: levelsheet-cache
          path: cache/
          retention-days: 7
